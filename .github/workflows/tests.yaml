name: Tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install Home Assistant test harness
        run: pip install pytest-homeassistant-custom-component
      - name: Run tests (parsers and Home Assistant)
        run: pytest -v
