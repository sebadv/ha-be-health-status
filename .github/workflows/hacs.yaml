name: HACS validation

# Only run on demand (Actions tab → HACS validation → Run workflow).
# Re-enable push/schedule triggers once the repository is public and stable.
on:
  workflow_dispatch:

jobs:
  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration
