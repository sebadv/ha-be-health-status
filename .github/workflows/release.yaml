name: Release

# Creates a GitHub release (and tag) vX.Y.Z whenever the version in
# manifest.json changes on main, so the Marketplace / HACS shows version
# numbers instead of commit hashes.
on:
  push:
    branches: [main]
    paths:
      - custom_components/be_health_status/manifest.json
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: version
        run: |
          version=$(jq -r .version custom_components/be_health_status/manifest.json)
          echo "tag=v${version}" >> "$GITHUB_OUTPUT"

      - name: Create release if it does not exist yet
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists"
          else
            gh release create "$TAG" --target "$GITHUB_SHA" --title "$TAG" --generate-notes
          fi
